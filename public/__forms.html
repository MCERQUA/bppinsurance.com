<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
<!-- Netlify Forms pre-render declaration for Next.js -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="insurance-type" />
  <input name="message" />
  <input name="street_address" />
  <input name="city" />
  <input name="state" />
  <input name="zip" />
  <input name="fein" />
  <input name="year_business_started" />
  <input name="business_description" />
  <input name="prior_carrier_name" />
  <input name="prior_policy_number" />
  <input name="prior_policy_expiration" />
</form>
<form name="claims" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="claims" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="policy-number" />
  <input name="claim-type" />
  <input name="incident-date" />
  <input name="description" />
  <input name="documents" />
<label>Street: <input type="text" name="street" required /></label>
<label>City: <input type="text" name="city" required /></label>
<label>State: <select name="state" required><option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option></select></label>
<label>ZIP: <input type="text" name="zip" inputMode="numeric" pattern="[0-9]{5}(-[0-9]{4})?" required /></label>
</form>
<form name="blog-comment" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="blog-comment" />
  <input name="bot-field" />
  <input name="post-slug" />
  <input name="post-title" />
  <input name="name" />
  <input name="email" />
  <input name="comment" />
</form>

</body>
</html>
