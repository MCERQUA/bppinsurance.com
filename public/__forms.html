<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
<!-- Netlify Forms pre-render declaration for Next.js -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="insurance-type" />
  <input name="message" />
  <input name="street_address" />
  <input name="city" />
  <input name="state" />
  <input name="zip" />
  <input name="fein" />
  <input name="year_business_started" />
  <input name="business_description" />
  <input name="prior_carrier_name" />
  <input name="prior_policy_number" />
  <input name="prior_policy_expiration" />
</form>
<form name="claims" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="claims" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="policy-number" />
  <input name="claim-type" />
  <input name="incident-date" />
  <input name="description" />
  <input name="documents" />
</form>
<form name="blog-comment" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="blog-comment" />
  <input name="bot-field" />
  <input name="post-slug" />
  <input name="post-title" />
  <input name="name" />
  <input name="email" />
  <input name="comment" />
</form>

</body>
</html>
